name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml

  required:
    name: CI required
    if: always()
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require all checks and all three native builds
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success
