name: Build desktop

on:
  workflow_call:
    inputs:
      release_tag:
        description: Optional version tag to validate before building
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Source checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Validate application version and release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python3 scripts/ci/release.py versions --tag "$RELEASE_TAG"
          else
            python3 scripts/ci/release.py versions
          fi
      - name: Check release validation
        run: python3 -m unittest discover -s tests -p 'test_release.py' -v
      - name: Lint GitHub workflows
        run: python3 scripts/ci/lint-workflows.py
      - name: Audit Tauri trust boundaries and configuration
        run: |
          python3 -m unittest discover -s scripts/ci/tauri-audit -p 'test_*.py' -v
          python3 scripts/ci/tauri-audit/audit_tauri_project.py .
      - run: npm ci
      - name: ESLint, frontend tests, TypeScript and Vite build
        run: npm run check

  native:
    name: Native (${{ matrix.target }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
            target: macos-arm64
          - runner: ubuntu-22.04
            platform: linux
            target: linux-x86_64
          - runner: windows-2022
            platform: windows
            target: windows-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'
      APPIMAGE_EXTRACT_AND_RUN: '1'
      DSH_APPIMAGE_RUNTIME_TEST: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build and native test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl ca-certificates pkg-config libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf file xdg-utils libfuse2 \
            xvfb dbus-x11 webkit2gtk-driver xdotool squashfs-tools python3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-
      - run: npm ci
      - name: Build local WebView assets for a fresh native checkout
        run: npm run build
      - name: Rust formatting, Clippy and tests (locked)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts/ci
          npm run native:check 2>&1 | tee artifacts/ci/rust-check.log
      - name: Rust formatting, Clippy and tests on Windows (locked)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/ci | Out-Null
          npm.cmd run native:check 2>&1 | Tee-Object artifacts/ci/rust-check.log
          if ($LASTEXITCODE -ne 0) { throw "Rust checks failed: $LASTEXITCODE" }
      - name: Check Windows packaging script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem scripts/ci/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Build packages and verify native integration
        if: runner.os != 'Windows'
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          bash scripts/ci/build-desktop.sh "$BUILD_PLATFORM" 2>&1 | tee artifacts/ci/native-build.log
      - name: Build Windows installers and verify installation and lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/build-windows.ps1 -VerifyInstallers *>&1 | Tee-Object artifacts/ci/native-build.log
      - name: Upload verified packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.target }}
          path: artifacts/release-${{ matrix.target }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true
      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            artifacts/ci/*.log
            artifacts/linux/*.png
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
